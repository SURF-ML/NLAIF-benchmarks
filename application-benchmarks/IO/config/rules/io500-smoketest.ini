# IO500 smoketest — tiny functional run of the full IO500 harness
# Version:  io500-sc26, commit ddabf2e (same build as io500-posix.ini)
# Run:      <launcher> <N tasks, P per node> ./io500 io500-smoketest.ini
#           (set datadir and resultdir first)
#
# Purpose / what we are testing
#   Not a performance benchmark. Verifies that the io500 binary, MPI launch and target
#   filesystem work, in a few minutes. The short stonewall and small sizes make
#   IO500 flag the run [INVALID]; that is expected here.
#
#   Data volume per process is capped: ior-easy 64 MiB, ior-hard 200 × 47008 B ≈ 9 MiB,
#   mdtest-easy and mdtest-hard 200 files each. The 30 s stonewall lets mdtest-hard create
#   all 200 files per process on a slow shared directory: find matches names containing "01"
#   (e.g. file 101), so with fewer than ~102 files per process it finds nothing.

[global]
datadir = ./datafiles
resultdir = ./results
timestamp-datadir = TRUE
timestamp-resultdir = TRUE
api = POSIX
dataPacketType = random
verbosity = 1

[debug]
stonewall-time = 30                # debug value: invalidates the run

[ior-easy]
transferSize = 1m
blockSize = 64m

[mdtest-easy]
n = 200

[ior-hard]
segmentCount = 200

[mdtest-hard]
n = 200

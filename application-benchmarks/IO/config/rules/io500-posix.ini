# IO500 standard run, POSIX API — NLAIF configuration (B5)
# Version:  io500-sc26 (https://github.com/IO500/io500), commit ddabf2efc978f8650c29176ca422bb0bf3e8990a
# Run:      <launcher> <N tasks, P per node> ./io500 io500-posix.ini
#           (set datadir and resultdir first)
#
# Purpose / what we are testing
#   The official IO500 benchmark, unmodified: ior-easy/hard write and read, mdtest-easy/hard
#   write, stat, read and delete, and find. The ior-rnd4K-easy-read phase (random 4 KiB reads)
#   runs in standard mode too; it is reported but not scored.
#
#   Only the keys marked TUNABLE may be changed; they are the variables the IO500 rules allow
#   to be tuned. The vendor sets them so that every write phase runs for at least the 300 s
#   stonewall (a phase that finishes early is INVALID). All other keys are fixed.
#
#   dataPacketType = random regenerates every transfer from a per-item seed, so the data
#   cannot be compressed. Seeds repeat across processes and offsets, so deduplication is not
#   prevented; IO500 rule 9 forbids data reduction. The IO500 default (timestamp) writes the
#   same buffer for every transfer.
#
#   datadir and resultdir below are placeholders: set them to a directory on the storage
#   system under test and to a results directory.

[global]
datadir = ./datafiles
resultdir = ./results
timestamp-datadir = TRUE
timestamp-resultdir = TRUE
api = POSIX
dataPacketType = random
verbosity = 1

[debug]
stonewall-time = 300               # fixed: any other value invalidates the run

[ior-easy]
transferSize = 2m                  # TUNABLE
blockSize = 9920000m               # TUNABLE: multiple of transferSize, lasts >= 300 s
filePerProc = TRUE                 # TUNABLE
uniqueDir = FALSE                  # TUNABLE

[mdtest-easy]
n = 1000000                        # TUNABLE: files per process, lasts >= 300 s

[ior-hard]
segmentCount = 10000000            # TUNABLE: segments per process, lasts >= 300 s

[mdtest-hard]
n = 1000000                        # TUNABLE: files per process, lasts >= 300 s
